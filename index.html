<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FCPLG Attendance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 35px 20px 25px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      color: #172033;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
      color: #667085;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(16, 24, 40, 0.10);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 22px;
      color: #172033;
    }

    #initials {
      width: 100%;
      height: 52px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 18px;
      text-transform: uppercase;
      outline: none;
      transition: 0.2s;
    }

    #initials:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.10);
    }

    button {
      width: 100%;
      height: 50px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #172033;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover:not(:disabled) {
      background: #26334d;
      transform: translateY(-1px);
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .employee-info,
    .employee-display {
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: #eef4ff;
      text-align: center;
    }

    .employee-info strong,
    .employee-display strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .employee-info span,
    .employee-display span {
      color: #667085;
      font-size: 14px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      margin: 20px auto 0;
      overflow: hidden;
      border-radius: 15px;
      background: #101010;
      aspect-ratio: 4 / 3;
    }

    #video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #f2f4f7;
      color: #475467;
      text-align: center;
      font-size: 14px;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      color: #98a2b3;
      font-size: 13px;
    }

    .footer span:first-child {
      font-weight: 700;
      color: #667085;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 12px;
      }

      .card {
        padding: 20px;
        border-radius: 15px;
      }

      .header h1 {
        font-size: 27px;
      }

      h2 {
        font-size: 20px;
      }

      #initials {
        height: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>FCPLG Attendance</h1>
      <p>Face Verified Attendance System</p>
    </div>

    <div class="card">

      <!-- STEP 1 -->
      <div id="initialStep">

        <h2>Enter Your Initials</h2>

        <input
          type="text"
          id="initials"
          placeholder="e.g. SP"
          maxlength="5"
          autocomplete="off"
        >

        <button id="continueBtn">
          CONTINUE
        </button>

        <div id="employeeInfo" class="employee-info hidden"></div>

      </div>


      <!-- STEP 2 -->
      <div id="verificationStep" class="hidden">

        <h2>Face Verification</h2>

        <div id="employeeDisplay" class="employee-display"></div>

        <div class="camera-container">

          <video
            id="video"
            autoplay
            muted
            playsinline
          ></video>

          <canvas id="overlay"></canvas>

        </div>

        <div id="cameraStatus" class="status">
          Starting camera...
        </div>

        <button id="verifyBtn" disabled>
          VERIFY FACE
        </button>

      </div>


      <!-- RESULT -->
      <div id="result" class="result hidden"></div>

    </div>


    <div class="footer">
      <span>FCPLG</span>
      <span>Attendance System</span>
    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
